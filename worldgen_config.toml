[project]
name = "metro-map-worldgen"
compose_file = "docker-compose.worldgen.yml"

[world]
image = "itzg/minecraft-bedrock-server:2025.11.0"
server_version = "1.26.10.4"
direct_download_url = "https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-1.26.10.4.zip"
seed = "437241185583693582"
level_name = "metro_map_world_boxfill"
eula = "TRUE"
port = 19132
online_mode = "false"
allow_cheats = "true"
gamemode = "creative"
default_player_permission_level = "operator"
view_distance = 32
tick_distance = 4
player_idle_timeout = 0
startup_text = "Server started."
startup_timeout_seconds = 300
stop_timeout_seconds = 60

[headless_loader]
username = "MetroChunkLoader"
client_version = "26.10"
raknet_backend = "raknet-native"
wait_seconds = 75
teleport_y = 96
teleport_delay_seconds = 8
teleport_retry_seconds = 4
teleport_attempts = 4
chunk_radius = 16
target_outset_blocks = 0
target_overlap_blocks = 0

[lan]
enabled = true
world_name = "Plumville"
host = "192.168.1.168"
port = 19132
username = "PlumvilleMapper"
client_version = "26.10"
raknet_backend = "raknet-native"
wait_seconds = 75
chunk_radius = 16
connect_timeout_ms = 20000

[storage]
data_dir = "~/Library/Application Support/Plumville/worldgen/bedrock-data"
cache_dir = "~/Library/Application Support/Plumville/worldgen/cache"
output_dir = "~/Library/Application Support/Plumville/worldgen/output"

[render]
center_label = "Blackport"
center_x = 294
center_z = 390
radius = 2000
min_x = -8000
max_x = 9000
min_z = -5000
max_z = 7000
sample_step = 1
